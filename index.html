<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Samtskhe Digital Map & Booking</title>
  
  <!-- Google Fonts: Noto Sans Georgian -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --accent: #f59e0b;
      --success: #10b981;
      --radius: 16px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Georgian', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background-color: #0f172a; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }

    /* Phone Shell Container */
    #app-container {
      width: 100%;
      max-width: 390px;
      height: 100vh;
      max-height: 844px;
      background-color: var(--bg);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 450px) {
      #app-container { height: 92vh; border-radius: 40px; border: 8px solid #1e293b; }
    }

    /* Scrollable Screen Content */
    .screen { flex: 1; overflow-y: auto; display: flex; flex-direction: column; position: relative; padding-bottom: 70px; }
    .screen.no-pb { padding-bottom: 0; }

    /* Bottom Navigation Bar */
    .nav-bar {
      position: absolute; bottom: 0; left: 0; right: 0; height: 65px;
      background: var(--surface); border-top: 1px solid var(--border);
      display: flex; justify-content: space-around; align-items: center; z-index: 1000;
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: 500;
      cursor: pointer; width: 20%; min-height: 44px; justify-content: center;
    }
    .nav-item.active { color: var(--primary); font-weight: 600; }
    .nav-item svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

    /* Common Components */
    .btn {
      width: 100%; min-height: 48px; background: var(--primary); color: white;
      border: none; border-radius: var(--radius); font-weight: 600; font-size: 15px;
      display: flex; justify-content: center; align-items: center; gap: 8px; cursor: pointer;
    }
    .btn:active { background: var(--primary-dark); }
    .btn-outline { background: transparent; border: 1.5px solid var(--border); color: var(--text); }
    .btn-sm { min-height: 36px; font-size: 13px; padding: 0 14px; border-radius: 10px; width: auto; }

    .card { background: var(--surface); border-radius: var(--radius); padding: 16px; border: 1px solid var(--border); margin-bottom: 12px; }
    .header { padding: 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; }
    .header h2 { font-size: 18px; font-weight: 700; flex: 1; }

    .chip-list { display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; scrollbar-width: none; }
    .chip-list::-webkit-scrollbar { display: none; }
    .chip {
      padding: 8px 16px; border-radius: 20px; background: var(--surface);
      border: 1px solid var(--border); font-size: 13px; white-space: nowrap; cursor: pointer;
    }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Map UI */
    #map { width: 100%; height: 100%; z-index: 1; }
    .map-overlay { position: absolute; top: 12px; left: 12px; right: 12px; z-index: 500; display: flex; flex-direction: column; gap: 8px; }
    .search-box {
      background: var(--surface); border-radius: 24px; padding: 10px 16px;
      display: flex; align-items: center; gap: 10px; box-shadow: var(--shadow); border: 1px solid var(--border);
    }
    .search-box input { border: none; outline: none; width: 100%; font-size: 14px; background: transparent; }

    .bottom-preview {
      position: absolute; bottom: 75px; left: 12px; right: 12px; z-index: 500;
      background: var(--surface); border-radius: var(--radius); padding: 14px;
      box-shadow: var(--shadow); border: 1px solid var(--border); display: flex; gap: 12px;
    }
    .bottom-preview img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }

    .badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; background: #eff6ff; color: var(--primary); }
    .badge-success { background: #ecfdf5; color: var(--success); }

    /* Form Controls */
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
    .input-group input, .input-group select, .input-group textarea {
      width: 100%; padding: 12px; border-radius: 12px; border: 1px solid var(--border);
      outline: none; font-size: 14px; background: var(--surface);
    }

    /* Modal Sheet */
    .modal { position: absolute; inset: 0; background: rgba(0,0,0,0.5); z-index: 2000; display: flex; flex-direction: column; justify-content: flex-end; }
    .modal-content { background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px; max-height: 85%; overflow-y: auto; }
  </style>
</head>
<body>

<div id="app-container">
  <!-- Dynamic Screen Area -->
  <div id="screen-container" class="screen"></div>

  <!-- Bottom Navigation Bar -->
  <nav class="nav-bar" id="nav-bar">
    <button class="nav-item active" onclick="switchTab('map')">
      <svg viewBox="0 0 24 24"><path d="M9 20l-6-3V4l6 3 6-3 6 3v13l-6-3-6 3z"/></svg>
      <span id="txt-nav-map">რუკა</span>
    </button>
    <button class="nav-item" onclick="switchTab('planner')">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4l3 3"/></svg>
      <span id="txt-nav-planner">AI გეგმა</span>
    </button>
    <button class="nav-item" onclick="switchTab('bookings')">
      <svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V6a2 2 0 00-2-2zM16 2v4M8 2v4M3 10h18"/></svg>
      <span id="txt-nav-bookings">ჯავშნები</span>
    </button>
    <button class="nav-item" onclick="switchTab('profile')">
      <svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      <span id="txt-nav-profile">პროფილი</span>
    </button>
  </nav>

  <!-- Modal Container -->
  <div id="modal-container"></div>
</div>

<!-- Leaflet JS for OpenStreetMap -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

const DATA = {

  user: { name: 'მარიამი', points: 140, isAuth: true },

    },

      img: 'https://images.unsplash.com/photo-1560066984-138dadb4c035?w=400',
      desc: 'სრული ესთეტიკური სერვისი ახალციხის ცენტრში: ვარცხნილობა, მაკიაჟი, ფრჩხილების მოვლა.',
      services: [
        { id: 301, title: 'თმის დავარცხნა & სტილი', price: 25 },
        { id: 302, title: 'სადღესასწაულო მაკიაჟი', price: 45 }
      ]
    },
    {
      id: 4, name: 'Vardzia & Rabati Local Guide', cat: 'guides', lat: 41.6398, lng: 42.9810,
      price: 100, rating: 5.0, reviews: 64,
      img: 'https://images.unsplash.com/photo-1533105079780-92b9be482077?w=400',
      desc: 'სერტიფიცირებული გიდი სამცხე-ჯავახეთში. ვარძიის, რაბათისა და საფარის დეტალური ტურები.',
      services: [{ id: 401, title: 'სრული დღის გიდის მომსახურება', price: 100 }]
    }
  ],

  bookings: [
    { id: 'BK-8821', bizName: 'Rabati Castle Guesthouse', service: 'ორადგილიანი ნომერი', date: '2026-09-25', time: '14:00', price: 80, deposit: 16, status: 'confirmed' }
  ]

/* ================= 2. TRANSLATIONS ================= */
const I18N = {
  ka: {
    map: 'რუკა', planner: 'AI გეგმა', bookings: 'ჯავშნები', profile: 'პროფილი',
    all: 'ყველა', hotels: 'სასტუმროები', cafes: 'კაფეები', salons: 'სალონები', guides: 'გიდები',
    book: 'დაჯავშნა', price_from: 'დან', deposit: '20% დეპოზიტი', confirm_pay: 'დაჯავშნა და გადახდა',
    ai_title: 'AI მოგზაურობის დაგეგმვა', ai_desc: 'მიუთითეთ ბიუჯეტი და AI შეგიდგენთ ოპტიმალურ მარშრუტს.',
    budget: 'ბიუჯეტი (₾)', days: 'დღეების რაოდენობა', generate: 'მარშრუტის შექმნა',
    owner_panel: 'ბიზნესის პანელი', reg_biz: 'ბიზნესის დამატება (უფასო)'
  },
  en: {
    map: 'Map', planner: 'AI Plan', bookings: 'Bookings', profile: 'Profile',
    all: 'All', hotels: 'Hotels', cafes: 'Cafes', salons: 'Salons', guides: 'Guides',
    book: 'Book Now', price_from: 'From', deposit: '20% Deposit', confirm_pay: 'Book & Pay Deposit',
    ai_title: 'AI Trip Planner', ai_desc: 'Set your budget and AI will generate an optimal itinerary.',
    budget: 'Budget (₾)', days: 'Days', generate: 'Generate Plan',
    owner_panel: 'Business Dashboard', reg_biz: 'Register Business (Free)'
  }
};

function t(key) { return I18N[DATA.lang][key] || key; }

/* ================= 3. RENDER SCREENS ================= */
let leafletMap = null;

function renderApp() {
  const container = document.getElementById('screen-container');
  const nav = document.getElementById('nav-bar');
  
  // Toggle Nav Bar Visibility for Owner mode
  nav.style.display = DATA.role === 'owner_dash' ? 'none' : 'flex';

  if (DATA.currentTab === 'map') renderMapScreen(container);
  else if (DATA.currentTab === 'planner') renderPlannerScreen(container);
  else if (DATA.currentTab === 'bookings') renderBookingsScreen(container);
  else if (DATA.currentTab === 'profile') renderProfileScreen(container);
  else if (DATA.currentTab === 'biz_detail') renderBizDetailScreen(container);
  else if (DATA.currentTab === 'owner_dash') renderOwnerDashboard(container);
}

/* --- MAP SCREEN --- */
function renderMapScreen(container) {
  container.className = 'screen no-pb';
  container.innerHTML = `
    <div class="map-overlay">
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" placeholder="მოძებნე ახალციხეში..." oninput="filterSearch(this.value)">
      </div>
      <div class="chip-list">
        <button class="chip ${DATA.selectedCategory==='all'?'active':''}" onclick="setCategory('all')">${t('all')}</button>
        <button class="chip ${DATA.selectedCategory==='hotels'?'active':''}" onclick="setCategory('hotels')">${t('hotels')}</button>
        <button class="chip ${DATA.selectedCategory==='cafes'?'active':''}" onclick="setCategory('cafes')">${t('cafes')}</button>
        <button class="chip ${DATA.selectedCategory==='salons'?'active':''}" onclick="setCategory('salons')">${t('salons')}</button>
        <button class="chip ${DATA.selectedCategory==='guides'?'active':''}" onclick="setCategory('guides')">${t('guides')}</button>
      </div>
    </div>

    <div id="map"></div>

    ${DATA.selectedBiz ? `
      <div class="bottom-preview" onclick="openBizDetail(${DATA.selectedBiz.id})">
        <img src="${DATA.selectedBiz.img}" alt="">
        <div style="flex:1">
          <span class="badge">${t(DATA.selectedBiz.cat)}</span>
          <h4 style="font-size:14px; margin:4px 0;">${DATA.selectedBiz.name}</h4>
          <div style="font-size:12px; color:var(--text-muted)">★ ${DATA.selectedBiz.rating} (${DATA.selectedBiz.reviews})</div>
          <div style="font-size:13px; font-weight:700; margin-top:4px;">${t('price_from')} ₾${DATA.selectedBiz.price}</div>
        </div>
        <button class="btn btn-sm" onclick="event.stopPropagation(); openBizDetail(${DATA.selectedBiz.id})">${t('book')}</button>
      </div>
    ` : ''}
  `;

  // Init Leaflet Map
  setTimeout(() => {
    if (leafletMap) leafletMap.remove();
    leafletMap = L.map('map', { zoomControl: false }).setView([41.6398, 42.9825], 14); // Akhaltsikhe Center
    
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(leafletMap);

    // Filter Markers
    const filtered = DATA.selectedCategory === 'all' 
      ? DATA.businesses 
      : DATA.businesses.filter(b => b.cat === DATA.selectedCategory);

    filtered.forEach(b => {
      const marker = L.marker([b.lat, b.lng]).addTo(leafletMap);
      marker.on('click', () => {
        DATA.selectedBiz = b;
        renderApp();
      });
    });
  }, 50);
}

/* --- BUSINESS DETAIL SCREEN --- */
function renderBizDetailScreen(container) {
  container.className = 'screen';
  const b = DATA.selectedBiz;
  container.innerHTML = `
    <div class="header">
      <button class="btn-outline btn-sm" onclick="switchTab('map')">←</button>
      <h2>${b.name}</h2>
    </div>
    <img src="${b.img}" style="width:100%; height:200px; object-fit:cover;">
    <div style="padding:16px">
      <div style="display:flex; justify-scale:space-between; align-items:center; margin-bottom:12px;">
        <span class="badge badge-success">✓ გადამოწმებული ობიექტი</span>
        <span style="font-weight:700; color:var(--accent);">★ ${b.rating} (${b.reviews})</span>
      </div>
      <p style="font-size:14px; color:var(--text-muted); margin-bottom:16px;">${b.desc}</p>

      <h3 style="font-size:16px; margin-bottom:12px;">სერვისები & ფასები</h3>
      ${b.services.map(s => `
        <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
          <div>
            <div style="font-weight:600; font-size:14px;">${s.title}</div>
            <div style="font-size:13px; color:var(--primary); font-weight:700;">₾${s.price}</div>
          </div>
          <button class="btn btn-sm" onclick="startBooking(${b.id}, ${s.id})">${t('book')}</button>
        </div>
      `).map(x=>x).join('')}
    </div>
  `;
}

/* --- BOOKINGS SCREEN --- */

/* --- PROFILE SCREEN --- */

  container.className = 'screen';
  container.innerHTML = `
    <div class="header"><h2>${t('profile')}</h2></div>
    <div style="padding:16px;">
      <div class="card" style="text-align:center; padding:24px;">
        <div style="width:60px; height:60px; border-radius:50%; background:var(--primary); color:white; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; margin:0 auto 12px;">M</div>
        <h3>${DATA.user.name}</h3>
        <p style="font-size:13px; color:var(--text-muted);">+995 591 ** ** **</p>
        <div style="margin-top:12px; display:inline-block;" class="badge">🎁 ლოიალობის ქულები: <b>${DATA.user.points} B-Coins</b></div>
      </div>

      <div class="card">
        <h4>ენა / Language</h4>
        <div style="display:flex; gap:8px; margin-top:8px;">
          <button class="btn btn-sm ${DATA.lang==='ka'?'':'btn-outline'}" onclick="setLang('ka')">ქართული</button>
          <button class="btn btn-sm ${DATA.lang==='en'?'':'btn-outline'}" onclick="setLang('en')">English</button>
        </div>
      </div>
